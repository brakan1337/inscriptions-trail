name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (SQLite puis MySQL, comme sur un mutualisé)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: inscriptions
          MYSQL_ROOT_PASSWORD: racine-ci-jetable
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pracine-ci-jetable"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Style (Pint)
        run: vendor/bin/pint --test
      - name: Les vues se compilent
        run: php artisan view:cache
      - name: Tests sur SQLite
        run: php artisan test
      - name: Tests sur MySQL
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: inscriptions
          DB_USERNAME: root
          DB_PASSWORD: racine-ci-jetable
      - name: Les migrations et les données de démonstration passent sur MySQL
        run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: inscriptions
          DB_USERNAME: root
          DB_PASSWORD: racine-ci-jetable
